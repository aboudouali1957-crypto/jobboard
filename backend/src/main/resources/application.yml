spring:
  application:
    name: jobboard-api

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jobboard?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:jobboard}
    password: ${DB_PASSWORD:jobboard}

  jpa:
    open-in-view: false
    hibernate:
      # Le schéma est géré exclusivement par Flyway (src/main/resources/db/migration)
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Charge les associations paresseuses par lots pour éviter les requêtes N+1
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

  data:
    web:
      pageable:
        max-page-size: 50

  threads:
    virtual:
      enabled: true

  web:
    locale: fr
    locale-resolver: fixed

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  jwt:
    # 32 octets minimum (HS256). À surcharger impérativement en production via JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
    expiration: ${JWT_EXPIRATION:2h}
    issuer: jobboard-api
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  storage:
    cv-dir: ${CV_STORAGE_DIR:./storage/cv}
  mail:
    from: ${MAIL_FROM:JobBoard <no-reply@jobboard.dev>}
    enabled: ${MAIL_ENABLED:true}
  admin:
    email: ${ADMIN_EMAIL:admin@jobboard.dev}
    password: ${ADMIN_PASSWORD:Admin123!}
  seed:
    demo-data: ${SEED_DEMO_DATA:true}
