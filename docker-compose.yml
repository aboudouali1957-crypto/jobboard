# Lance toute la plateforme : docker compose up --build
#   Application  : http://localhost:4200
#   API / Swagger: http://localhost:8080/swagger-ui.html
#   Emails       : http://localhost:8025 (Mailpit intercepte tous les envois)
#
# Pour le développement local, ne démarrer que l'infrastructure : docker compose up mysql mailpit

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: jobboard
      MYSQL_USER: jobboard
      MYSQL_PASSWORD: jobboard
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/jobboard?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: jobboard
      DB_PASSWORD: jobboard
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-change-me-0123456789abcdef}
      FRONTEND_URL: http://localhost:4200
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      CV_STORAGE_DIR: /app/storage/cv
      SEED_DEMO_DATA: "true"
    ports:
      - "8081:8080"
    volumes:
      - cv-storage:/app/storage

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  mysql-data:
  cv-storage:
