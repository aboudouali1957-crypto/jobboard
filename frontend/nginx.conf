server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Taille maximale d'un CV (5 Mo) + marge pour l'enveloppe multipart
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API et documentation Swagger servies par le back-end : même origine, donc pas de CORS en production
    location ~ ^/(api|swagger-ui|v3/api-docs)(/|\.html|$) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers générés avec un hash dans leur nom : mise en cache longue durée
    location ~* \.(js|css|woff2?|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Application monopage : toute autre route est gérée par le routeur Angular
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
